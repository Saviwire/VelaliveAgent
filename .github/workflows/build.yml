name: Build iOS App
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
    - name: Build App
      run: |
        # Create a basic Xcode project structure on the fly
        mkdir Payload
        # (GitHub Actions will use xcodebuild here once a project file is added)
        echo "Building..."
    - name: Package IPA
      run: |
        mkdir Payload
        echo "Fake .app file for now" > Payload/VelaliveAgent.app
        zip -r VelaliveAgent.ipa Payload
    - name: Upload Artifact
      uses: actions/upload-artifact@v3
      with:
        name: VelaliveAgent-IPA
        path: VelaliveAgent.ipa
